<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121722">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Saúde e Treino</title>
<style>
:root{--bg:#121722;--s1:#1a2130;--s2:#232c3d;--bd:#2e3a4f;--tx:#e6ebf4;--mu:#93a0b5;--ac:#8ea2ff;--acx:#0f1630;--ok:#5fd39a;--wa:#f0b64d;--da:#ff6b6b;--in:#6cc4ff;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:16px/1.45 Roboto,system-ui,-apple-system,sans-serif}
body{padding:calc(62px + env(safe-area-inset-top)) 0 calc(76px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--ac);outline-offset:2px}
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:rgba(18,23,34,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
#hdate{font-weight:700;font-size:18px;letter-spacing:-.01em}
#hweek{font-size:13px;color:var(--mu)}
main{max-width:560px;margin:0 auto;padding:14px 12px 96px;display:flex;flex-direction:column;gap:12px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;padding:2px 4px}
h2{font-size:15px;font-weight:700;color:var(--mu);margin-bottom:10px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:16px}
.stack{display:flex;flex-direction:column;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;gap:8px;align-items:stretch}
.row>*{flex:1;min-width:0}
.mt{margin-top:10px}
.mu{color:var(--mu);font-size:14px}
.c{text-align:center}
.tg{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:12px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--bd);font-size:16px;text-align:left}
.tg::before{content:'';flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--mu);display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--acx)}
.tg.on{border-color:var(--ac);background:#27304a}
.tg.on::before{content:'✓';background:var(--ac);border-color:var(--ac)}
.tg small{margin-left:auto;padding-left:8px;color:var(--mu);font-size:14px;text-align:right}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:0 18px;border-radius:14px;border:1px solid var(--bd);background:var(--s2);font-weight:600;font-size:16px;text-align:center}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:700}
.btn.big{justify-content:flex-start;min-height:66px;font-size:18px}
.btn.big span{font-size:22px;width:30px}
.rb{flex:none;width:64px;height:64px;border-radius:50%;border:1px solid var(--bd);background:var(--s2);font-size:30px;font-weight:600;line-height:1}
.rb.pri{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.seg{display:flex;background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:48px;border:0;border-radius:10px;background:none;font-weight:600;font-size:16px;color:var(--mu)}
.seg button.on{background:var(--ac);color:var(--acx)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mu)}
input[type=number],input[type=date]{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:19px;padding:0 12px}
input::placeholder{color:#5f6b80}
.rng{display:block;padding:6px 2px 2px}
.rl{display:flex;justify-content:space-between;align-items:baseline}
.rl output{font-weight:800;font-size:22px;min-width:2ch;text-align:right}
input[type=range]{width:100%;height:40px;accent-color:var(--ac)}
.bar{position:relative;height:10px;border-radius:6px;background:var(--s2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .2s}
.bar em{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.5}
.water{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wc{text-align:center}
.wc b{display:block;font-size:40px;line-height:1;font-weight:800}
.act{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.pill{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;background:var(--s2)}
.pill.ok{color:var(--ok)}.pill.warn,.pill.warn2{color:var(--wa)}.pill.danger{color:var(--da)}
.al,.res{border-radius:16px;padding:14px 16px;border:1px solid;background:var(--s1)}
.al b,.res b{display:block;font-size:17px}
.al p,.res p{margin-top:4px}
.al .do{font-weight:700;margin-top:6px}
.danger{border-color:var(--da);background:#2b1a22}.danger b{color:var(--da)}
.warn,.warn2{border-color:var(--wa);background:#2a2518}.warn b,.warn2 b{color:var(--wa)}
.ok{border-color:var(--ok);background:#16281f}.ok b{color:var(--ok)}
.info{border-color:var(--in);background:#15243a}.info b{color:var(--in)}
.res b{font-size:24px}
.res small{display:block;margin-top:6px;color:var(--mu)}
.dnav{display:flex;align-items:center;gap:10px}
.dnav div{flex:1;text-align:center}
.dnav small{display:block;color:var(--mu)}
.avg{margin-top:12px;font-size:17px}
.avg b{font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.kv b{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;font-size:14px;border:1px solid var(--da);color:#ffb3b3}
.meal p{margin-top:6px}
.meal p b{display:inline-block;width:24px;color:var(--ac)}
.ul{padding-left:20px}.ul li{margin:4px 0}
.ex .exh b{font-size:18px}
.ex .exh small{display:block;color:var(--mu);font-size:14px}
.last{margin:10px 0 6px;font-size:14px;color:var(--in)}
.hint{font-size:14px;margin-bottom:6px;color:var(--wa)}
.setr{display:grid;grid-template-columns:26px 1fr 30px 1fr 38px;align-items:center;gap:6px;margin-top:6px}
.setr span{color:var(--mu);font-size:14px}
.setr input{text-align:center}
.ch{width:100%;height:auto;display:block}
.ch text{fill:var(--mu);font-size:10px}
.ch .gl{stroke:var(--bd);stroke-width:1}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--mu)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,23,34,.97);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{height:66px;border:0;background:none;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button i{font-style:normal;font-size:21px;line-height:1}
nav button.on{color:var(--ac);font-weight:700}
#fab{flex:none;min-width:48px;height:48px;padding:0 14px;border-radius:999px;border:2px solid var(--da);background:#2b1a22;color:var(--da);font-size:15px;font-weight:800}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.nw{flex:none!important;white-space:nowrap;width:auto}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div><div id="hdate"></div><div id="hweek"></div></div><button id="fab" aria-label="Abrir alertas">⚠ Alertas</button></header>
<main id="app"></main>
<div id="toast"></div>
<nav>
  <button data-go="hoje"><i>☀</i>Hoje</button>
  <button data-go="triagem"><i>✚</i>Triagem</button>
  <button data-go="treino"><i>⚑</i>Treino</button>
  <button data-go="semana"><i>▦</i>Semanal</button>
  <button data-go="mais"><i>≡</i>Mais</button>
</nav>
<script>
'use strict';
const $=s=>document.querySelector(s);
const app=$('#app');
const DEFAULT_START='2026-09-30';
let S={start:DEFAULT_START,nevrix:null};
let view={name:'hoje'};
let db;

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('saude-pwa',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const store=m=>db.transaction('kv',m).objectStore('kv');
const p2=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const get=k=>p2(store('readonly').get(k));
const put=(k,v)=>p2(store('readwrite').put(v,k));
async function rangeGet(lo,hi){if(lo>hi)return[];const s=store('readonly'),r=IDBKeyRange.bound(lo,hi);const [k,v]=await Promise.all([p2(s.getAllKeys(r)),p2(s.getAll(r))]);return k.map((x,i)=>[x,v[i]]);}
const saveRec=()=>put(view.key,view.rec);
const saveS=()=>put('settings',S);

/* ---------- datas e formatos ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const today=()=>ymd(new Date());
const br=s=>{const [,m,d]=s.split('-');return `${d}/${m}`;};
const brY=s=>{const [y,m,d]=s.split('-');return `${d}/${m}/${y}`;};
const lastSunday=s=>{const d=parse(s);d.setDate(d.getDate()-d.getDay());return ymd(d);};
const WD=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const fmt1=v=>v==null||isNaN(v)?'–':String(Math.round(v*10)/10).replace('.',',');
const fmtInt=v=>Number(v||0).toLocaleString('pt-BR');
const r05=v=>Math.round(v*2)/2;
const getPath=(o,p)=>p.split('.').reduce((x,k)=>x==null?undefined:x[k],o);
function setPath(o,p,v){const ks=p.split('.');let x=o;for(let i=0;i<ks.length-1;i++){if(x[ks[i]]==null)x[ks[i]]={};x=x[ks[i]];}x[ks[ks.length-1]]=v;}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600);}

/* ---------- plano ---------- */
function planWeek(ds){const d=diffDays(ds,S.start);if(d<0)return{w:1,pre:true,over:false};const w=Math.floor(d/7)+1;return{w:Math.min(w,4),pre:false,over:w>4};}
function weekStart(ds){const d=diffDays(ds,S.start);return d<0?S.start:addDays(S.start,Math.floor(d/7)*7);}
function activity(ds){
  const w=planWeek(ds).w,inv=w===2||w===4,A=inv?'B':'A',B=inv?'A':'B';
  return [{t:'Caminhada 30 min'},{t:'Treino '+A,treino:A},{t:'Cardio zona 2, 30 min + mobilidade'},{t:'Treino '+B,treino:B},{t:'Caminhada 40 min + mobilidade'},{t:'Treino '+A,treino:A},{t:'Cardio zona 2, 40 min'}][parse(ds).getDay()];
}
function nextTreino(ds){for(let i=0;i<7;i++){const a=activity(addDays(ds,i));if(a.treino)return a.treino;}return 'A';}
const STEP_GOAL=[7000,7500,8500,9000];
const SETINFO={1:'2 séries, 3 repetições de sobra',2:'3 séries nos 4 primeiros, 2 nos demais; 3 de sobra',3:'3 séries em todos; 2 de sobra',4:'3 séries (4 no leg press e supino); 1–2 de sobra'};
const RIR={1:'3 de sobra',2:'3 de sobra',3:'2 de sobra',4:'1–2 de sobra'};
const MEALS=[['cafe','Café'],['almoco','Almoço'],['lanche','Lanche'],['jantar','Jantar'],['ceia','Ceia']];
const MEDS_AM=[['f1','Fórmula 1 (clomifeno + empagliflozina)'],['vort','Vortioxetina 15'],['f2','Fórmula 2 (vitaminas D/K2/A)'],['f3','Fórmula 3 sublingual'],['creat','Creatina 3–5 g'],['venv','Venvanse (só se usar)']];
const MEDS_PM=[['quet','Quetiapina 12,5']];
const EX={
  A:[['legpress','Leg press 45°','10–12'],['supino','Supino com halteres','8–12'],['remada','Remada com peito apoiado','10–12'],['flexora','Mesa flexora','10–12'],['facepull','Face pull','15'],['elevlat','Elevação lateral','12–15'],['deadbug','Dead bug','10 por lado']],
  B:[['agach','Agachamento goblet ou hack','8–12'],['puxada','Puxada neutra','10–12'],['supinc','Supino inclinado com halteres','8–12'],['hip','Hip thrust','10–12'],['rosca','Rosca na polia','12'],['triceps','Tríceps na polia','12'],['pallof','Pallof press','10 por lado']]
};
function nSets(w,i,id,exh){let n=w===1?2:w===2?(i<4?3:2):w===3?3:(['legpress','supino','supinc'].includes(id)?4:3);return exh?Math.max(1,n-1):n;}
const ANCH=[['legpress','Leg press'],['supino','Supino com halteres'],['remada','Remada']];
const NOTAS=[['libido','Libido'],['energia','Energia'],['humor','Humor'],['sono','Sono'],['dor','Dor média']];
const SIDE=[['visual','Alteração visual'],['humor','Alteração de humor'],['mamilo','Sensibilidade no mamilo'],['coceira','Coceira genital'],['tontura','Tontura']];
const SHOP=[['frango','Peito de frango','1 kg'],['sobrecoxa','Sobrecoxa desossada','1,5 kg'],['moida','Carne moída','1 kg'],['figado','Fígado','300 g'],['ovos','Ovos','30'],['leite','Leite integral sem lactose','4 L'],['arroz','Arroz','500 g'],['feijao','Feijão e lentilha','500 g'],['aveia','Aveia','250 g'],['banana','Banana','10–12'],['frutas','Outras frutas','7'],['legumes','Legumes','2–2,5 kg'],['tomate','Tomate','1 kg'],['cebola','Cebola','1 kg'],['temperos','Alho, gengibre, limão',''],['amendoim','Amendoim','150 g']];
const SHOPM=[['whey','Whey','~1 kg'],['creatina','Creatina','pote 300 g (2 meses)'],['azeite','Azeite','1 L']];

/* ---------- triagem ---------- */
const TRI={
  normal:['ok','Treino normal','Siga o plano da semana.'],
  reduzir:['warn','Treino reduzido','Reduza a carga em 20–30% e troque o agachamento por leg press leve.'],
  caminhada:['warn2','Sem musculação hoje','Só caminhada e mobilidade.'],
  parar:['danger','PARE','Dor irradiando, formigamento ou fraqueza: não treine e procure avaliação médica.']
};
function triageResult(t){
  const max=Math.max(t.lomb||0,t.sacro||0,t.cerv||0);
  const lvl=t.irr?'parar':(max>=6||t.rig)?'caminhada':max>=4?'reduzir':'normal';
  return{lvl,max,exh:!!t.exh};
}
function triageBox(r){const [c,h,p]=TRI[r.lvl];return `<div class="res ${c}"><b>${h}</b><p>${p}</p><small>Maior dor: ${r.max}</small>${r.exh?'<p><strong>Exaustão 48h:</strong> tire 1 série de cada exercício nesta semana.</p>':''}</div>`;}

/* ---------- componentes ---------- */
const tg=(label,path,rec)=>`<button class="tg${getPath(rec,path)?' on':''}" data-a="tog" data-p="${path}">${label}</button>`;
function rng(label,path,rec,dash){const v=getPath(rec,path);return `<label class="rng"><div class="rl"><span>${label}</span><output>${v==null?(dash?'–':0):v}</output></div><input type="range" min="0" max="10" step="1" value="${v??0}" data-bind="${path}" data-rr="1"></label>`;}
function num(label,path,rec,attrs=''){const v=getPath(rec,path);return `<label class="fld"><span>${label}</span><input type="number" inputmode="decimal" value="${v??''}" data-bind="${path}" ${attrs}></label>`;}
const seg=(path,rec,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${getPath(rec,path)===v?'on':''}" data-a="set" data-p="${path}" data-v='${JSON.stringify(v)}'>${l}</button>`).join('')}</div>`;
const newDay=d=>({date:d,meals:{},meds:{},water:0,steps:null,protein:null,sleepH:null,sleepRec:null,actDone:false,triage:null});
async function getDay(d){return (await get('day:'+d))||newDay(d);}

/* ---------- gráfico SVG ---------- */
const PAL=['#8ea2ff','#5fd39a','#f0b64d','#ff8fc7','#6cc4ff'];
function fmtAx(v){return Math.abs(v)>=1000?String(Math.round(v/100)/10).replace('.',',')+'k':fmt1(v);}
function chart(title,labels,series,o={}){
  const vals=series.flatMap(s=>s.vals).filter(v=>v!=null&&!isNaN(v));
  if(!vals.length)return `<section class="card"><h2>${title}</h2><p class="mu">Sem dados ainda.</p></section>`;
  const W=340,H=190,L=40,R=12,T=12,B=28;
  let mn=o.min??Math.min(...vals),mx=o.max??Math.max(...vals);
  if(mx===mn){mx+=1;mn-=1;}
  const pd=(mx-mn)*.1;if(o.min==null)mn-=pd;if(o.max==null)mx+=pd;
  const n=labels.length,X=i=>n<2?(L+W-R)/2:L+i*(W-L-R)/(n-1),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let g='';
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-6}" y="${+y+3}" text-anchor="end">${fmtAx(v)}</text>`;}
  const step=Math.max(1,Math.ceil(n/6));
  labels.forEach((l,i)=>{const lastOk=i===n-1&&(n-1)%step>=step/2;if(i%step===0||lastOk)g+=`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${l}</text>`;});
  series.forEach((s,si)=>{
    const c=s.color||PAL[si%PAL.length];let d='',pen=false;
    s.vals.forEach((v,i)=>{if(v==null||isNaN(v)){pen=false;return;}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true;});
    g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${s.dash?1.5:2.5}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(!s.dash)s.vals.forEach((v,i)=>{if(v!=null&&!isNaN(v))g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.5" fill="${c}"/>`;});
  });
  const leg=series.length>1?`<div class="leg">${series.map((s,i)=>`<span><i style="background:${s.color||PAL[i%PAL.length]}"></i>${s.name}</span>`).join('')}</div>`:'';
  return `<section class="card"><h2>${title}</h2><svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="${title}">${g}</svg>${leg}</section>`;
}
const maxKg=(w,id)=>{const k=(w.sets?.[id]||[]).filter(s=>s&&s.kg!=null).map(s=>s.kg);return k.length?Math.max(...k):null;};

/* ---------- telas ---------- */
const screens={};

screens.hoje=async()=>{
  const t=today(),pw=planWeek(t),act=activity(t),rec=await getDay(t);
  view.rec=rec;view.key='day:'+t;
  const goal=STEP_GOAL[pw.w-1],cups=rec.water||0;
  const nvd=S.nevrix?diffDays(t,S.nevrix):null;
  const tri=rec.triage?.at?triageResult(rec.triage):null;
  const stepsTxt=s=>`${fmtInt(s)} de ${fmtInt(goal)}${s>=goal?' ✓':''}`;
  view.derive=()=>{const s=rec.steps||0,b=$('#stepsBar');if(b){b.style.width=Math.min(100,s/goal*100)+'%';$('#stepsTxt').textContent=stepsTxt(s);}};
  const wStat=cups<10?`faltam ${10-cups} copos para 2,5 L`:cups<=14?'dentro da meta':'acima de 3,5 L';
  const mealN=MEALS.filter(([k])=>rec.meals?.[k]).length;
  return `
  ${nvd!=null&&nvd>30?`<div class="al danger"><b>Nevrix atrasado</b><p>${nvd} dias desde a última dose (${brY(S.nevrix)}).</p></div>`:''}
  <section class="card">
    <h2>Atividade de hoje</h2>
    <div class="act">${act.t}</div>
    ${act.treino?`<p class="mu">Semana ${pw.w}: ${SETINFO[pw.w]}</p>`:''}
    ${tri?`<span class="pill ${TRI[tri.lvl][0]}">Triagem: ${TRI[tri.lvl][1]}${tri.exh?', 1 série a menos':''}</span>`:''}
    <div class="stack mt">

screens.treino=async()=>{
  const t=today(),pw=planWeek(t),day=await getDay(t),act=activity(t);
  let wo=await get('wo:'+t);
  if(!wo)wo={date:t,type:act.treino||nextTreino(t),week:pw.w,sets:{},done:false};
  view.rec=wo;view.key='wo:'+t;
  const tr=day.triage?.at?triageResult(day.triage):null;
  const exh=(await rangeGet('day:'+weekStart(t),'day:'+t)).some(([,d])=>d.triage?.at&&d.triage.exh);
  const prev=(await rangeGet('wo:','wo:'+t)).filter(([k])=>k!=='wo:'+t).map(x=>x[1]).reverse();
  const lastFor=id=>{for(const w of prev){const s=(w.sets?.[id]||[]).filter(x=>x&&(x.kg!=null||x.reps!=null));if(s.length)return{date:w.date,sets:w.sets[id]};}return null;};
  const red=tr?.lvl==='reduzir';
  const list=EX[wo.type].slice();
  if(red&&wo.type==='B')list[0]=['legpressleve','Leg press leve (no lugar do agachamento)','10–12'];
  let top='';
  if(!tr)top=`<div class="al info"><b>Triagem não feita hoje</b><button class="btn mt" data-a="go" data-v="triagem">Fazer triagem</button></div>`;
  else if(tr.lvl==='parar'||tr.lvl==='caminhada')top=triageBox(tr);
  else if(red)top=`<div class="al warn"><b>Treino reduzido</b><p>Carga 20–30% menor.${wo.type==='B'?' Agachamento trocado por leg press leve.':''}</p></div>`;
  if(exh)top+=`<div class="al warn"><b>Exaustão registrada nesta semana</b><p>Já aplicado: 1 série a menos em cada exercício.</p></div>`;
  if(!act.treino)top+=`<p class="mu">Hoje o plano é: ${act.t}.</p>`;
  const exHTML=list.map(([id,name,reps],i)=>{
    const n=nSets(pw.w,i,id,exh),last=lastFor(id),cur=wo.sets[id]||[];
    const lastSets=last?last.sets.filter(x=>x&&(x.kg!=null||x.reps!=null)):[];
    const topKg=last?maxKg(last,id):null;
    let rows='';
    for(let j=0;j<Math.max(n,cur.length);j++){
      const c=cur[j]||{},lk=last?.sets?.[j]?.kg;
      rows+=`<div class="setr"><span>${j+1}ª</span><input type="number" inputmode="decimal" step="0.5" placeholder="${lk!=null?fmt1(lk):'—'}" value="${c.kg??''}" data-sr="${id}|${j}|kg" aria-label="Carga série ${j+1}"><span>kg</span><input type="number" inputmode="numeric" placeholder="—" value="${c.reps??''}" data-sr="${id}|${j}|reps" aria-label="Repetições série ${j+1}"><span>reps</span></div>`;
    }
    return `<section class="card ex">
      <div class="exh"><b>${name}</b><small>${n} séries de ${reps}, ${RIR[pw.w]}</small></div>
      <div class="last">${last?`Última (${br(last.date)}): ${lastSets.map(x=>`${fmt1(x.kg)} kg × ${x.reps??'–'}`).join(', ')}`:'Sem registro anterior'}</div>
      ${red&&topKg?`<div class="hint">Hoje: ${fmt1(r05(topKg*.7))} a ${fmt1(r05(topKg*.8))} kg</div>`:''}
      ${rows}
    </section>`;
  }).join('');
  return `<h1>Treino ${wo.type}</h1>
  <div class="seg"><button class="${wo.type==='A'?'on':''}" data-a="woType" data-v="A">Treino A</button><button class="${wo.type==='B'?'on':''}" data-a="woType" data-v="B">Treino B</button></div>
  <p class="mu">Semana ${pw.w}: ${SETINFO[pw.w]}.</p>
  ${top}
  <section class="card"><h2>Aquecimento</h2><p>5 min de bicicleta, gato-vaca e rotação torácica.</p></section>
  ${exHTML}
  <button class="btn ${wo.done?'':'pri'}" data-a="woDone">${wo.done?'Treino concluído ✓ (desfazer)':'Concluir treino'}</button>`;
};

function suggHTML(list,rec){
  const all=list.filter(x=>x.date!==rec.date).concat([rec]).sort((a,b)=>a.date<b.date?-1:1);
  const i=all.indexOf(rec),p=all[i-1],pp=all[i-2],out=[];
  const has=(o,f)=>o&&o[f]!=null&&!isNaN(o[f]);
  if(p){
    const parts=[];
    if(has(rec,'avg')&&has(p,'avg')){const d=rec.avg-p.avg;parts.push(`peso ${d>0?'+':''}${fmt1(d)} kg`);}
    if(has(rec,'waist')&&has(p,'waist')){const d=rec.waist-p.waist;parts.push(`cintura ${d>0?'+':''}${fmt1(d)} cm`);}
    if(parts.length)out.push(`<div class="al info"><b>Em relação a ${br(p.date)}</b><p>${parts.join(', ')}</p></div>`);
  }
  const noDrop=(a,b,f)=>has(a,f)&&has(b,f)&&a[f]>=b[f];
  if(p&&pp&&noDrop(rec,p,'waist')&&noDrop(p,pp,'waist')&&noDrop(rec,p,'avg')&&noDrop(p,pp,'avg'))
    out.push(`<div class="al warn"><b>Sugestão: tirar 150 kcal</b><p>Cintura e peso médio sem queda há 2 semanas. Tire 40 g de arroz do jantar e metade do amendoim da ceia.</p></div>`);
  if(p&&has(rec,'avg')&&has(p,'avg')&&p.avg-rec.avg>1&&rec.forca)
    out.push(`<div class="al warn"><b>Sugestão: acrescentar 150 kcal</b><p>Perda acima de 1 kg na semana com força caindo ou fadiga. Acrescente arroz no almoço.</p></div>`);
  const pw=planWeek(rec.date);
  if(!pw.pre&&pw.w===1)out.push(`<div class="al info"><b>Semana 1</b><p>Parte da perda de peso é água, por causa da empagliflozina.</p></div>`);
  if(rec.side?.visual)out.push(`<div class="al danger"><b>Alteração visual</b><p class="do">Pare o clomifeno e ligue para o médico hoje.</p></div>`);
  if(rec.side?.humor)out.push(`<div class="al warn"><b>Alteração de humor</b><p class="do">Se for queda forte, avise o médico.</p></div>`);
  if(rec.side?.tontura)out.push(`<div class="al info"><b>Tontura</b><p class="do">Beba mais água.</p></div>`);
  return out.join('');
}
function avg3(r){const v=[r.p1,r.p2,r.p3].filter(x=>x!=null&&!isNaN(x));return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)/100:null;}

/* ---------- backup ---------- */
async function exportJSON(){
  const all=await rangeGet('','\uffff');
  const data={app:'saude-pwa',version:1,exportedAt:new Date().toISOString(),entries:Object.fromEntries(all)};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`saude-backup-${today()}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Backup exportado');
}
async function importJSON(file){
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(data.app!=='saude-pwa'||!data.entries||typeof data.entries!=='object')throw new Error('este arquivo não é um backup deste app.');
    const n=Object.keys(data.entries).length;
    if(!confirm(`Importar ${n} registros? Todos os dados atuais serão substituídos.`))return;
    await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite'),s=t.objectStore('kv');s.clear();for(const [k,v] of Object.entries(data.entries))s.put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});
    S=Object.assign({start:DEFAULT_START,nevrix:null},(await get('settings'))||{});
    header();toast('Backup importado');await render();
  }catch(err){alert('Não foi possível importar: '+err.message);}
}

  woType:async t=>{view.rec.type=t.dataset.v;await saveRec();await render();},
  woDone:async()=>{
    const w=view.rec;w.done=!w.done;w.week=planWeek(w.date).w;await saveRec();
    if(w.done){const d=await getDay(w.date);d.actDone=true;await put('day:'+d.date,d);toast('Treino concluído');}
    await render();
  },
  wk:async t=>{view.wk=addDays(view.wk,Number(t.dataset.d));await render();},
  shopReset:async t=>{view.rec[t.dataset.v]={};await saveRec();await render();},
  export:()=>exportJSON()
};

let Q=Promise.resolve();
const enqueue=fn=>(Q=Q.then(fn).catch(err=>console.error(err)));
app.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&actions[t.dataset.a])enqueue(()=>actions[t.dataset.a](t));});
app.addEventListener('input',e=>{const t=e.target;if(t.type==='range'){const o=t.closest('.rng')?.querySelector('output');if(o)o.textContent=t.value;}});
app.addEventListener('change',e=>{const t=e.target;enqueue(()=>onChange(t));});
async function onChange(t){
  const ds=t.dataset;
  const numVal=()=>{if(t.value==='')return null;const v=Number(String(t.value).replace(',','.'));return isNaN(v)?null:v;};
  if(ds.bind){
    setPath(view.rec,ds.bind,(t.type==='range'||t.type==='number')?numVal():(t.value||null));
    view.derive?.();await saveRec();if(ds.rr)await render();
  }else if(ds.sr){
    const [id,j,f]=ds.sr.split('|'),w=view.rec,arr=w.sets[id]||(w.sets[id]=[]);
    while(arr.length<=+j)arr.push(null);
    arr[j]=arr[j]||{};arr[j][f]=numVal();w.week=planWeek(w.date).w;await saveRec();
  }else if(ds.s){
    S[ds.s]=t.value||(ds.s==='start'?DEFAULT_START:null);await saveS();header();await render();
  }else if('imp' in ds){const f=t.files[0];t.value='';await importJSON(f);}
}

/* ---------- navegação ---------- */
const MORE=['mais','graficos','plano','compras','alertas','config'];
let seq=0;
async function render(){
  const id=++seq;view.derive=null;
  const html=await screens[view.name]();
  if(id!==seq)return;
  app.innerHTML=html;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===view.name||(b.dataset.go==='mais'&&MORE.includes(view.name))));
}
function go(name,push=true){if(push&&name!==view.name)history.pushState({s:name},'');view={name};scrollTo(0,0);return render();}
function header(){
  const t=today(),pw=planWeek(t);
  $('#hdate').textContent=`${WD[parse(t).getDay()]}, ${brY(t)}`;
  $('#hweek').textContent=pw.pre?`Plano começa em ${brY(S.start)}`:`Semana ${pw.w} de 4${pw.over?' (plano encerrado)':''}`;
}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)enqueue(()=>go(b.dataset.go));});
$('#fab').addEventListener('click',()=>enqueue(()=>go('alertas')));
window.addEventListener('popstate',e=>enqueue(()=>go(e.state?.s||'hoje',false)));
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastDay){lastDay=today();header();enqueue(render);}});

(async()=>{
  try{db=await openDB();}catch(e){app.innerHTML='<div class="al danger"><b>Erro ao abrir o banco de dados</b><p>Feche e abra o app de novo. Se continuar, verifique se o Chrome não está em modo anônimo.</p></div>';return;}
  S=Object.assign({start:DEFAULT_START,nevrix:null},(await get('settings'))||{});
  header();history.replaceState({s:'hoje'},'');enqueue(render);
  navigator.storage?.persist?.().catch(()=>{});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
